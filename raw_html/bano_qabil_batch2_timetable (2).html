<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bano Qabil — Batch 2 Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;
  --pink:#993556;--pink-light:#FBEAF0;--pink-mid:#D4537E;
  --green:#3B6D11;--green-light:#EAF3DE;--green-mid:#639922;
  --bg:#F8F7F4;--surface:#FFFFFF;--border:#E8E6E0;--border2:#D3D1C7;
  --text:#1a1a18;--text2:#5F5E5A;--text3:#888780;
  --dm:#378ADD;--gd:#9F3FBF;--ve:#D85A30;--cs:#E24B4A;--aie:#1D9E75;--wd:#BA7517;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:#1a1a18;border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px;fill:white}
.logo-text{font-size:15px;font-weight:600;color:var(--text)}
.logo-sub{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.header-right{display:flex;align-items:center;gap:10px}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;display:flex;align-items:center;gap:6px;transition:all 0.15s}
.btn:hover{background:var(--bg);border-color:var(--text3)}
.btn-primary{background:var(--text);color:white;border-color:var(--text)}
.btn-primary:hover{background:#333;border-color:#333}
.main{max-width:1100px;margin:0 auto;padding:2rem}
.campus-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;width:fit-content;margin-bottom:1.5rem}
.campus-tab{padding:8px 24px;border-radius:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.campus-tab.active{background:var(--text);color:white}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:600;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.stat-m{border-top:3px solid var(--blue-mid)}
.stat-f{border-top:3px solid var(--pink-mid)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.chart-title{font-size:12px;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative}
.bar-label{font-size:12px;color:var(--text2);font-weight:500;width:36px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace}
.bar-track{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:visible;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width 0.4s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;display:flex;align-items:center}
.bar-tooltip{display:none;position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:var(--text);color:white;font-size:11px;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:50;line-height:1.5;pointer-events:none}
.bar-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--text)}
.bar-fill:hover .bar-tooltip{display:block}
.bar-val{font-size:11px;color:var(--text3);width:36px;font-family:'DM Mono',monospace}
.donut-section{display:flex;align-items:center;justify-content:center;gap:28px;padding:8px 0}
.donut-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-num{font-size:18px;font-weight:600;color:var(--text)}
.donut-lbl{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.gender-items{display:flex;flex-direction:column;gap:14px}
.gender-item{display:flex;align-items:center;gap:10px}
.g-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.g-info{display:flex;flex-direction:column;gap:1px}
.g-name{font-size:12px;color:var(--text2)}
.g-val{font-size:16px;font-weight:600;color:var(--text)}
.g-pct{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.section-header{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.room-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.room-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg)}
.room-name{font-size:14px;font-weight:600;color:var(--text)}
.room-badge{font-size:11px;padding:2px 10px;border-radius:20px;background:var(--surface);color:var(--text3);border:1px solid var(--border);font-family:'DM Mono',monospace}
.timetable{width:100%;border-collapse:collapse}
.timetable th{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);font-weight:500}
.timetable th:first-child{text-align:left;width:90px}
.timetable td{padding:6px;border-bottom:1px solid var(--border);vertical-align:middle}
.timetable tr:last-child td{border-bottom:none}
.timetable .day-cell{font-size:12px;font-weight:500;color:var(--text2);padding:6px 12px;font-family:'DM Mono',monospace}
.slot-cell{cursor:pointer}
.slot-inner{border-radius:8px;padding:10px 12px;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;transition:opacity 0.15s;border:1px solid transparent}
.slot-inner:hover{opacity:0.85}
.slot-inner.empty{background:var(--bg);border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center}
.slot-empty-txt{font-size:11px;color:var(--text3)}
.slot-course-name{font-size:12px;font-weight:600}
.slot-gender-badge{font-size:10px;padding:2px 7px;border-radius:12px;display:inline-block;margin-top:4px;font-weight:500}
.slot-cap-txt{font-size:10px;margin-top:6px;opacity:0.7;font-family:'DM Mono',monospace}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1.25rem}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-dot{width:8px;height:8px;border-radius:50%}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:24px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:18px;color:var(--text)}
.modal-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:18px;margin-top:-12px}
.field{margin-bottom:14px}
.field label{font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
.field select,.field input{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif}
.field select:focus,.field input:focus{outline:none;border-color:var(--blue-mid)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions button{flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500}
.btn-save-m{background:var(--text);color:white;border-color:var(--text)}
.btn-clear-m{background:white;color:#E24B4A;border-color:#F09595}
.btn-cancel-m{background:white;color:var(--text2);border-color:var(--border2)}
.divider{height:1px;background:var(--border);margin:1.5rem 0}
@media print{
  header .header-right,.campus-tabs,.legend-row,.modal-bg{display:none!important}
  header{position:relative;border-bottom:2px solid #1a1a18}
  body{background:white}
  .main{padding:1rem}
  .stats-row,.charts-row{page-break-inside:avoid}
  .room-block{page-break-inside:avoid;border:1px solid #ccc}
  .slot-inner.empty{display:none!important}
  .slot-cell{cursor:default}
  .btn{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
    </div>
    <div>
      <div class="logo-text">Bano Qabil — Batch 2</div>
      <div class="logo-sub">Timetable Management</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn" onclick="window.print()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print page
    </button>
    <button class="btn btn-primary" onclick="exportData()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export JSON
    </button>
  </div>
</header>

<div class="main">
  <div class="campus-tabs">
    <button class="campus-tab active" onclick="switchCampus('ds')">Darussalam Campus</button>
    <button class="campus-tab" onclick="switchCampus('ic')">Islamic Center</button>
  </div>

  <div class="stats-row" id="stats-row"></div>
  <div class="charts-row" id="charts-row"></div>
  <div class="divider"></div>

  <div class="legend-row">
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue-mid)"></div>Male</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--pink-mid)"></div>Female</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green-mid)"></div>Mixed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border2)"></div>Empty — click to assign</div>
  </div>

  <div id="campus-view"></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-title" id="modal-title">Edit slot</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="field">
      <label>Course</label>
      <select id="m-course">
        <option value="">— empty —</option>
        <option value="DM">Digital Marketing</option>
        <option value="GD">Graphic Design</option>
        <option value="VE">Video Editing</option>
        <option value="CS">Cybersecurity</option>
        <option value="AiE">AI Essentials</option>
        <option value="WD">Website Development</option>
      </select>
    </div>
    <div class="field">
      <label>Gender</label>
      <select id="m-gender">
        <option value="M">Male</option>
        <option value="F">Female</option>
        <option value="M+F">Mixed (M+F)</option>
      </select>
    </div>
    <div class="field">
      <label>Capacity (seats)</label>
      <input type="number" id="m-cap" min="1" max="200">
    </div>
    <div class="modal-actions">
      <button class="btn-clear-m" onclick="clearSlot()">Clear</button>
      <button class="btn-cancel-m" onclick="closeModal()">Cancel</button>
      <button class="btn-save-m" onclick="saveSlot()">Save</button>
    </div>
  </div>
</div>

<script>
const SLOTS=['9–11 am','11:30 am–1:30 pm','2–4 pm','4:30–6:30 pm'];
const DAYS=['Mon – Tue','Wed – Thu','Sat – Sun'];
const COURSE_NAMES={DM:'Digital Marketing',GD:'Graphic Design',VE:'Video Editing',CS:'Cybersecurity',AiE:'AI Essentials',WD:'Website Dev'};
const COURSE_COLORS={DM:'#378ADD',GD:'#9F3FBF',VE:'#D85A30',CS:'#E24B4A',AiE:'#1D9E75',WD:'#BA7517'};
const COURSE_BG={DM:'#E6F1FB',GD:'#F3E8FA',VE:'#FAECE7',CS:'#FCEBEB',AiE:'#E1F5EE',WD:'#FAEEDA'};

const campuses={
  ds:{name:'Darussalam Campus',rooms:[
    {id:'ds-lab1',label:'Computer Lab 1',type:'lab',cap:50,slots:{}},
    {id:'ds-lab2',label:'Computer Lab 2',type:'lab',cap:40,slots:{}},
    {id:'ds-cls',label:'Classroom',type:'class',cap:50,slots:{}}
  ]},
  ic:{name:'Islamic Center',rooms:[
    {id:'ic-lab',label:'Computer Lab',type:'lab',cap:35,slots:{}},
    {id:'ic-cls',label:'Classroom',type:'class',cap:45,slots:{}}
  ]}
};

const defaults={
  'ds-lab1':{
    '0-0':{course:'GD',gender:'M',cap:50},'0-1':{course:'GD',gender:'F',cap:50},
    '0-2':{course:'VE',gender:'F',cap:50},'0-3':{course:'VE',gender:'M',cap:50},
    '1-0':{course:'CS',gender:'M',cap:50},'1-1':{course:'CS',gender:'F',cap:50},
    '1-2':{course:'WD',gender:'F',cap:50},'1-3':{course:'WD',gender:'M',cap:50},
    '2-0':{course:'CS',gender:'M',cap:50},'2-1':{course:'CS',gender:'F',cap:50},
    '2-2':{course:'GD',gender:'F',cap:50},'2-3':{course:'GD',gender:'M',cap:50}
  },
  'ds-lab2':{
    '0-0':{course:'VE',gender:'M',cap:40},'0-1':{course:'VE',gender:'F',cap:40},
    '1-0':{course:'CS',gender:'M',cap:40},'1-1':{course:'CS',gender:'F',cap:40},
    '2-0':{course:'WD',gender:'M',cap:40},'2-1':{course:'WD',gender:'F',cap:40}
  },
  'ds-cls':{
    '0-0':{course:'DM',gender:'M',cap:50},'0-1':{course:'DM',gender:'F',cap:50},
    '0-2':{course:'AiE',gender:'F',cap:50},'0-3':{course:'AiE',gender:'M',cap:50},
    '1-0':{course:'DM',gender:'M',cap:50},'1-1':{course:'DM',gender:'F',cap:50},
    '1-2':{course:'AiE',gender:'F',cap:50},'1-3':{course:'AiE',gender:'M',cap:50},
    '2-0':{course:'DM',gender:'M',cap:50},'2-1':{course:'DM',gender:'F',cap:50},
    '2-2':{course:'AiE',gender:'F',cap:50},'2-3':{course:'AiE',gender:'M',cap:50}
  },
  'ic-lab':{
    '0-0':{course:'GD',gender:'M',cap:35},'0-1':{course:'GD',gender:'F',cap:35},
    '0-2':{course:'VE',gender:'F',cap:35},'0-3':{course:'VE',gender:'M',cap:35},
    '1-0':{course:'CS',gender:'M',cap:35},'1-1':{course:'CS',gender:'F',cap:35},
    '2-0':{course:'WD',gender:'M',cap:35},'2-1':{course:'WD',gender:'F',cap:35}
  },
  'ic-cls':{
    '0-0':{course:'DM',gender:'M',cap:45},'0-1':{course:'DM',gender:'F',cap:45},
    '0-2':{course:'AiE',gender:'F',cap:45},'0-3':{course:'AiE',gender:'M',cap:45},
    '1-0':{course:'DM',gender:'M',cap:45},'1-1':{course:'DM',gender:'F',cap:45},
    '1-2':{course:'AiE',gender:'F',cap:45},'1-3':{course:'AiE',gender:'M',cap:45},
    '2-0':{course:'DM',gender:'M',cap:45},'2-1':{course:'DM',gender:'F',cap:45},
    '2-2':{course:'AiE',gender:'F',cap:45},'2-3':{course:'AiE',gender:'M',cap:45}
  }
};

Object.keys(defaults).forEach(rid=>{
  const campus=rid.startsWith('ds')?campuses.ds:campuses.ic;
  const room=campus.rooms.find(r=>r.id===rid);
  if(room)room.slots=JSON.parse(JSON.stringify(defaults[rid]));
});

let currentCampus='ds';
let editingSlot=null;

function switchCampus(c){
  currentCampus=c;
  document.querySelectorAll('.campus-tab').forEach((t,i)=>t.classList.toggle('active',i===(c==='ds'?0:1)));
  render();
}

function calcStats(c){
  let total=0,male=0,female=0,filled=0,totalSlots=0;
  const courseTotal={},courseM={},courseF={};
  c.rooms.forEach(room=>{
    for(let d=0;d<3;d++)for(let s=0;s<4;s++){
      totalSlots++;
      const sl=room.slots[d+'-'+s];
      if(sl){
        filled++;total+=sl.cap;
        if(sl.gender==='M')male+=sl.cap;
        else if(sl.gender==='F')female+=sl.cap;
        else{male+=Math.round(sl.cap/2);female+=Math.round(sl.cap/2);}
        courseTotal[sl.course]=(courseTotal[sl.course]||0)+sl.cap;
        const cm=sl.gender==='M'?sl.cap:sl.gender==='M+F'?Math.round(sl.cap/2):0;
        const cf=sl.gender==='F'?sl.cap:sl.gender==='M+F'?Math.round(sl.cap/2):0;
        courseM[sl.course]=(courseM[sl.course]||0)+cm;
        courseF[sl.course]=(courseF[sl.course]||0)+cf;
      }
    }
  });
  return{total,male,female,filled,totalSlots,courseTotal,courseM,courseF};
}

function render(){
  const c=campuses[currentCampus];
  const s=calcStats(c);
  renderStats(s);
  renderCharts(s);
  renderRooms(c);
}

function renderStats(s){
  const mPct=s.total?Math.round(s.male/s.total*100):0;
  const fPct=s.total?Math.round(s.female/s.total*100):0;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card">
      <div class="stat-label">Total capacity</div>
      <div class="stat-value">${s.total.toLocaleString()}</div>
      <div class="stat-sub">${s.filled} of ${s.totalSlots} slots filled</div>
    </div>
    <div class="stat-card stat-m">
      <div class="stat-label">Male students</div>
      <div class="stat-value" style="color:var(--blue)">${s.male.toLocaleString()}</div>
      <div class="stat-sub">${mPct}% of total</div>
    </div>
    <div class="stat-card stat-f">
      <div class="stat-label">Female students</div>
      <div class="stat-value" style="color:var(--pink)">${s.female.toLocaleString()}</div>
      <div class="stat-sub">${fPct}% of total</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Courses running</div>
      <div class="stat-value">${Object.keys(s.courseTotal).length}</div>
      <div class="stat-sub">out of 6 offered</div>
    </div>`;
}

function renderCharts(s){
  const entries=Object.entries(s.courseTotal).sort((a,b)=>b[1]-a[1]);
  const maxVal=Math.max(...entries.map(e=>e[1]),1);
  const bars=entries.map(([code,total])=>{
    const m=s.courseM[code]||0,f=s.courseF[code]||0;
    const pct=Math.round(total/maxVal*100);
    const col=COURSE_COLORS[code];
    return`<div class="bar-row">
      <div class="bar-label">${code}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${col}">
          <div class="bar-tooltip">${COURSE_NAMES[code]}<br>Total: ${total} &nbsp;·&nbsp; M: ${m} &nbsp;·&nbsp; F: ${f}</div>
        </div>
      </div>
      <div class="bar-val">${total}</div>
    </div>`;
  }).join('');

  const total=s.male+s.female||1;
  const mP=Math.round(s.male/total*100),fP=100-mP;
  const r=42,cx=55,cy=55,circ=2*Math.PI*r;
  const mD=circ*mP/100,fD=circ*fP/100;

  document.getElementById('charts-row').innerHTML=`
    <div class="chart-card">
      <div class="chart-title">Students per course — hover for breakdown</div>
      ${bars||'<div style="font-size:12px;color:var(--text3)">No slots assigned yet</div>'}
    </div>
    <div class="chart-card">
      <div class="chart-title">Gender distribution</div>
      <div class="donut-section">
        <div class="donut-wrap">
          <svg viewBox="0 0 110 110" width="110" height="110">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F1EFE8" stroke-width="16"/>
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#378ADD" stroke-width="16"
              stroke-dasharray="${mD} ${circ-mD}" transform="rotate(-90 ${cx} ${cy})"/>
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#D4537E" stroke-width="16"
              stroke-dasharray="${fD} ${circ-fD}" stroke-dashoffset="${-mD}" transform="rotate(-90 ${cx} ${cy})"/>
          </svg>
          <div class="donut-center">
            <div class="donut-num">${s.total.toLocaleString()}</div>
            <div class="donut-lbl">total</div>
          </div>
        </div>
        <div class="gender-items">
          <div class="gender-item">
            <div class="g-dot" style="background:#378ADD"></div>
            <div class="g-info">
              <div class="g-name">Male</div>
              <div class="g-val">${s.male.toLocaleString()}</div>
              <div class="g-pct">${mP}%</div>
            </div>
          </div>
          <div class="gender-item">
            <div class="g-dot" style="background:#D4537E"></div>
            <div class="g-info">
              <div class="g-name">Female</div>
              <div class="g-val">${s.female.toLocaleString()}</div>
              <div class="g-pct">${fP}%</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

function renderRooms(c){
  const view=document.getElementById('campus-view');
  view.innerHTML=`<div class="section-header">${c.name} — Schedule</div>`;
  c.rooms.forEach(room=>{
    const block=document.createElement('div');
    block.className='room-block';
    let html=`<div class="room-header">
      <div class="room-name">${room.label}</div>
      <div class="room-badge">${room.type==='lab'?'Computer Lab':'Classroom'}</div>
      <div class="room-badge">${room.cap} seats max</div>
    </div>
    <table class="timetable">
      <thead><tr>
        <th></th>
        ${SLOTS.map(s=>`<th>${s}</th>`).join('')}
      </tr></thead>
      <tbody>`;
    DAYS.forEach((day,d)=>{
      html+=`<tr><td class="day-cell">${day}</td>`;
      for(let s=0;s<4;s++){
        const key=d+'-'+s;
        const sl=room.slots[key];
        if(sl){
          const col=COURSE_COLORS[sl.course];
          const bg=COURSE_BG[sl.course];
          const gBg=sl.gender==='M'?'#E6F1FB':sl.gender==='F'?'#FBEAF0':'#EAF3DE';
          const gCol=sl.gender==='M'?'#0C447C':sl.gender==='F'?'#72243E':'#27500A';
          html+=`<td class="slot-cell" onclick="openModal('${room.id}',${d},${s},true)">
            <div class="slot-inner" style="background:${bg};border-color:${col}22">
              <div>
                <div class="slot-course-name" style="color:${col}">${sl.course}</div>
                <span class="slot-gender-badge" style="background:${gBg};color:${gCol}">${sl.gender}</span>
              </div>
              <div class="slot-cap-txt">${sl.cap} seats</div>
            </div>
          </td>`;
        } else {
          html+=`<td class="slot-cell" onclick="openModal('${room.id}',${d},${s},false)">
            <div class="slot-inner empty"><span class="slot-empty-txt">+ assign</span></div>
          </td>`;
        }
      }
      html+=`</tr>`;
    });
    html+=`</tbody></table>`;
    block.innerHTML=html;
    view.appendChild(block);
  });
}

function findRoom(rid){
  for(const c of Object.values(campuses))for(const r of c.rooms)if(r.id===rid)return r;
}

function openModal(roomId,d,s,hasSlot){
  const room=findRoom(roomId);
  const sl=hasSlot?room.slots[d+'-'+s]:null;
  editingSlot={roomId,d,s};
  document.getElementById('modal-title').textContent='Edit slot';
  document.getElementById('modal-sub').textContent=`${DAYS[d]}  ·  ${SLOTS[s]}  ·  ${room.label}`;
  document.getElementById('m-course').value=sl?sl.course:'';
  document.getElementById('m-gender').value=sl?sl.gender:'M';
  document.getElementById('m-cap').value=sl?sl.cap:room.cap;
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open');editingSlot=null;}

function saveSlot(){
  if(!editingSlot)return;
  const course=document.getElementById('m-course').value;
  const room=findRoom(editingSlot.roomId);
  const key=editingSlot.d+'-'+editingSlot.s;
  if(!course){delete room.slots[key];}
  else{room.slots[key]={course,gender:document.getElementById('m-gender').value,cap:parseInt(document.getElementById('m-cap').value)||room.cap};}
  closeModal();render();
}

function clearSlot(){
  if(!editingSlot)return;
  const room=findRoom(editingSlot.roomId);
  delete room.slots[editingSlot.d+'-'+editingSlot.s];
  closeModal();render();
}

function exportData(){
  const data={exported:new Date().toISOString(),campuses:{}};
  Object.entries(campuses).forEach(([key,c])=>{
    data.campuses[key]={name:c.name,rooms:c.rooms.map(r=>({id:r.id,label:r.label,type:r.type,cap:r.cap,slots:r.slots}))};
  });
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bano_qabil_batch2_data.json';
  a.click();
}

document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});
render();
</script>
</body>
</html>
